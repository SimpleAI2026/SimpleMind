<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思维导图卡片视图</title>
    <style>
        :root {
            /* Mirror public/app.css chrome + card-page tokens for one visual language. */
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --indent-width: 24px;
            --color-primary: #00c0b8;
            --page-bg: #f4f6f8;
            --page-text: #374151;
            --title-color: #1f2937;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-bg-nested: #fbfcfd;
            --card-bg-deep: #f7f8fa;
            --card-text: #374151;
            --card-text-muted: #6b7280;
            --card-border: rgba(0, 0, 0, 0.06);
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            --card-shadow-nested: 0 1px 2px rgba(0, 0, 0, 0.04);
            --card-shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.1);
            --card-radius: 12px;
            --connector-color: #f0f0f0;
            --card-hover-border: color-mix(in srgb, var(--color-primary) 35%, var(--card-border));

            --accent-mint: #f3faf8;
            --accent-sky: #f3f7fb;
            --accent-sand: #fbf7f2;
            --accent-lilac: #f7f5fb;
            --accent-sage: #f4f8f4;
            --accent-rose: #fbf5f6;
            --accent-slate: #f5f7f9;
            --accent-cream: #fbf8f2;

            --card-tint: var(--card-bg);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--page-bg);
            margin: 0;
            padding: var(--space-4) var(--space-4) var(--space-5);
            color: var(--page-text);
            -webkit-font-smoothing: antialiased;
        }

        h2 {
            text-align: center;
            margin: var(--space-2) 0 var(--space-4);
            color: var(--title-color);
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.35;
        }

        #app {
            max-width: 920px;
            margin: 0 auto;
        }

        .node-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            margin-bottom: var(--space-2);
        }

        .children-wrapper {
            padding-left: var(--indent-width);
            border-left: 1px solid var(--connector-color);
            margin-left: var(--space-3);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .card {
            background-color: var(--card-tint);
            border-radius: var(--card-radius);
            padding: var(--space-3) var(--space-4);
            box-shadow: var(--card-shadow);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            position: relative;
            color: var(--card-text);
            min-width: 200px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .card:hover {
            transform: translateY(-1px);
            box-shadow: var(--card-shadow-hover);
            border-color: var(--card-hover-border);
        }

        .card.tint-mint { --card-tint: var(--accent-mint); }
        .card.tint-sky { --card-tint: var(--accent-sky); }
        .card.tint-sand { --card-tint: var(--accent-sand); }
        .card.tint-lilac { --card-tint: var(--accent-lilac); }
        .card.tint-sage { --card-tint: var(--accent-sage); }
        .card.tint-rose { --card-tint: var(--accent-rose); }
        .card.tint-slate { --card-tint: var(--accent-slate); }
        .card.tint-cream { --card-tint: var(--accent-cream); }

        .children-wrapper > .node-wrapper > .card {
            box-shadow: var(--card-shadow-nested);
            background-color: color-mix(in srgb, var(--card-tint) 55%, var(--card-bg-nested));
        }

        .children-wrapper .children-wrapper > .node-wrapper > .card {
            background-color: color-mix(in srgb, var(--card-tint) 30%, var(--card-bg-deep));
        }

        .card-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 0;
            color: var(--title-color);
        }

        .card-note {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.55;
            margin-top: var(--space-2);
            color: var(--card-text-muted);
            white-space: pre-wrap;
        }

        .children-wrapper .card-text {
            font-size: 14px;
            font-weight: 600;
        }

        .children-wrapper .children-wrapper .card-text {
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            body {
                padding: var(--space-3) var(--space-3) var(--space-4);
            }
            .children-wrapper {
                padding-left: 14px;
                margin-left: 6px;
            }
        }
    </style>
</head>
<body>

    <h2 id="topic-title">思维导图Card</h2>
    <div id="app"></div>

    <script>
        const cardData =
        // {{REPLACE:cardData BEGIN}}
        {}
        // {{REPLACE:cardData END}}

        const tints = ['mint', 'sky', 'sand', 'lilac', 'sage', 'rose', 'slate', 'cream'];

        function createCardElement(nodeData) {
            const card = document.createElement('div');
            card.className = 'card';

            let hash = 0;
            const str = (nodeData.text || '') + (nodeData.uid || '');
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const tint = tints[Math.abs(hash) % tints.length];
            card.classList.add('tint-' + tint);

            const textEl = document.createElement('div');
            textEl.className = 'card-text';
            textEl.textContent = nodeData.text || '无标题节点';
            card.appendChild(textEl);

            if (nodeData.note) {
                const noteEl = document.createElement('div');
                noteEl.className = 'card-note';
                noteEl.textContent = nodeData.note;
                card.appendChild(noteEl);
            }

            return card;
        }

        function renderNodes(nodes, container) {
            if (!nodes || nodes.length === 0) return;

            nodes.forEach(node => {
                const nodeWrapper = document.createElement('div');
                nodeWrapper.className = 'node-wrapper';

                if (node.data) {
                    nodeWrapper.appendChild(createCardElement(node.data));
                }

                if (node.children && node.children.length > 0) {
                    const childrenWrapper = document.createElement('div');
                    childrenWrapper.className = 'children-wrapper';
                    renderNodes(node.children, childrenWrapper);
                    nodeWrapper.appendChild(childrenWrapper);
                }

                container.appendChild(nodeWrapper);
            });
        }

        const appContainer = document.getElementById('app');

        if (cardData.data && cardData.data.text) {
            document.getElementById('topic-title').textContent = cardData.data.text;
        }

        const rootNodes = cardData.children ? cardData.children : [cardData];
        renderNodes(rootNodes, appContainer);
    </script>
</body>
</html>
